services:
  api:
    build: .
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/ecommerce?replicaSet=rs0
      - JWT_SECRET=ecommerce_production_secure_jwt_secret_key_at_least_32_chars
      - JWT_EXPIRES_IN=15m
      - CLIENT_URL=http://localhost:3000
      - ADMIN_EMAIL=admin@ecommerce.example.com
      - ADMIN_PASSWORD=AdminPassword123!
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    entrypoint:
      - bash
      - -c
      - |
        /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all &
        MONGOPID=$$!
        until mongosh --eval "try { rs.status() } catch (e) { rs.initiate() }" > /dev/null 2>&1; do
          sleep 1
        done
        wait $$MONGOPID
    healthcheck:
      test: mongosh --eval "rs.status().ok" --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
